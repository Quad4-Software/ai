# Local/self-hosted deployment of the MCP toolkit gateway.
# The gateway speaks stdio MCP by default. HTTP is only started when
# HTTP_PORT is set, which is used by the Coolify-ready compose file.

services:
  mcp:
    image: ghcr.io/quad4-software/ai/mcp-toolkit:latest
    build:
      context: ../
      dockerfile: docker/Dockerfile
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      MCP_READ_ONLY: "1"
      GATEWAY_CONFIG: "/app/config/quad4-mcp.json"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
