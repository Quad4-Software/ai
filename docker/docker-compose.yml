# SPDX-License-Identifier: 0BSD
# Coolify-ready deployment of the MCP toolkit gateway.
# The gateway exposes a status/health HTTP endpoint on port 8080
# for reverse-proxy integration. Assign a domain in Coolify as
# http(s)://example.com:8080.
#
# The stdio MCP server still runs over the process stdio; this
# HTTP surface is read-only status data and is not the MCP transport.

services:
  mcp:
    image: ghcr.io/quad4-software/ai/mcp-toolkit:latest
    build:
      context: ../
      dockerfile: docker/Dockerfile
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    expose:
      - "8080"
    environment:
      MCP_READ_ONLY: "1"
      GATEWAY_CONFIG: "/app/config/quad4-mcp.json"
      HTTP_PORT: "8080"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
