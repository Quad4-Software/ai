# SPDX-License-Identifier: 0BSD
# Coolify-ready public deployment of the MCP toolkit gateway.
# Runs in -http mode: serves the status/health/SSE endpoints on
# HTTP_PORT and blocks on signals, so no stdin or TTY is required.
# In Coolify set the domain for the mcp service, for example
# https://mcp.example.com. SERVICE_FQDN_MCP_8080 routes it to
# container port 8080.
# For production, pin the image to an immutable digest instead of :latest.

services:
  mcp:
    image: ghcr.io/quad4-software/ai/mcp-toolkit:latest
    command: ["-http", "-read-only"]
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      MCP_READ_ONLY: "1"
      GATEWAY_CONFIG: "/app/config/quad4-mcp.json"
      HTTP_PORT: "8080"
      SERVICE_FQDN_MCP_8080:
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    healthcheck:
      test: ["CMD", "/app/mcp/gateway/gateway", "-health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 1g
    cpus: "2.0"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
