# Hardened public deployment of the MCP toolkit gateway.
# The gateway is a stdio MCP server, so no network port is exposed.
# For production, pin the image to an immutable digest instead of :latest.

services:
  mcp:
    image: ghcr.io/Quad4-Software/ai/mcp-toolkit:latest
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      MCP_READ_ONLY: "1"
      GATEWAY_CONFIG: "/app/config/quad4-mcp.json"
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 64
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
