# Coolify-ready public deployment of the MCP toolkit gateway.
# The gateway exposes a status/health HTTP endpoint on port 8080.
# In Coolify set the domain to http(s)://example.com:8080.
# For production, pin the image to an immutable digest instead of :latest.

services:
  mcp:
    image: ghcr.io/quad4-software/ai/mcp-toolkit:latest
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    expose:
      - "8080"
    environment:
      MCP_READ_ONLY: "1"
      GATEWAY_CONFIG: "/app/config/quad4-mcp.json"
      HTTP_PORT: "8080"
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 64
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
