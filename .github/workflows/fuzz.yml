# SPDX-License-Identifier: 0BSD
name: fuzz
on:
  push:
    paths:
      - 'micron-mcp/**'
      - '.github/workflows/fuzz.yml'
  pull_request:
    paths:
      - 'micron-mcp/**'
      - '.github/workflows/fuzz.yml'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@5c6294f65b6e27a9f0b85a469efb074d601c8c26 # v2.0.0
        with:
          egress-policy: audit
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: stable
      - name: fuzz-micron
        run: cd micron-mcp && go test -fuzz=Fuzz -fuzztime=30s -run='^$' .
