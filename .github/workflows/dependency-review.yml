# SPDX-License-Identifier: 0BSD
name: dependency-review
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@5c6294f65b6e27a9f0b85a469efb074d601c8c26 # v2.0.0
        with:
          egress-policy: audit
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/dependency-review-action@a6993c5e45666d398a58e6a000360ca25e58a131 # v3.1.3
        with:
          fail-on-severity: moderate
