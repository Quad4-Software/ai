  <rect x="28" y="0" width="1" height="22" fill="#000" fill-opacity=".15"/>
  <g fill="#fff" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" filter="url(#sci)">
