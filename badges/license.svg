<svg xmlns="http://www.w3.org/2000/svg" width="78" height="20" role="img" aria-label="license: 0BSD">
  <title>license: 0BSD</title>
  <linearGradient id="glicense" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="clicense">
    <rect width="78" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#clicense)">
    <rect width="38" height="20" fill="#555"/>
    <rect x="38" width="40" height="20" fill="#999"/>
    <rect width="78" height="20" fill="url(#glicense)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="19" y="14">license</text>
    <text x="58" y="14">0BSD</text>
  </g>
</svg>
