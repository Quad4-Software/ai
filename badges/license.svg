<svg xmlns="http://www.w3.org/2000/svg" width="78" height="22" role="img" aria-label="license: 0BSD">
  <title>license: 0BSD</title>
  <defs>
    <linearGradient id="glicense" x2="0" y2="100%">
      <stop offset="0" stop-color="#fff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#000" stop-opacity=".1"/>
    </linearGradient>
    <filter id="slicense" x="0" y="0" width="100%" height="100%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#000" flood-opacity=".2"/>
    </filter>
  </defs>
  <clipPath id="clicense">
    <rect width="78" height="22" rx="6" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#clicense)">
    <rect width="38" height="22" fill="#2d2d2d"/>
    <rect x="38" width="40" height="22" fill="#999"/>
    <rect width="78" height="22" fill="url(#glicense)"/>
  </g>
  <rect x="38" y="0" width="1" height="22" fill="#000" fill-opacity=".15"/>
  <g fill="#fff" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" filter="url(#slicense)">
    <text x="19" y="16">license</text>
    <text x="58" y="16">0BSD</text>
  </g>
</svg>
