  </g>
  <rect x="36" y="0" width="1" height="22" fill="#000" fill-opacity=".15"/>
  <g fill="#fff" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" filter="url(#srace)">
    <text x="18" y="16">race</text>
    <text x="65" y="16">passing</text>
  </g>
