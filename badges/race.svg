<svg xmlns="http://www.w3.org/2000/svg" width="94" height="20" role="img" aria-label="race: passing">
  <title>race: passing</title>
  <linearGradient id="grace" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="crace">
    <rect width="94" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#crace)">
    <rect width="36" height="20" fill="#555"/>
    <rect x="36" width="58" height="20" fill="#37d"/>
    <rect width="94" height="20" fill="url(#grace)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="18" y="14">race</text>
    <text x="65" y="14">passing</text>
  </g>
</svg>
