<svg xmlns="http://www.w3.org/2000/svg" width="94" height="22" role="img" aria-label="race: passing">
  <title>race: passing</title>
  <defs>
    <linearGradient id="grace" x2="0" y2="100%">
      <stop offset="0" stop-color="#fff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#000" stop-opacity=".1"/>
    </linearGradient>
    <filter id="srace" x="0" y="0" width="100%" height="100%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#000" flood-opacity=".2"/>
    </filter>
  </defs>
  <clipPath id="crace">
    <rect width="94" height="22" rx="6" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#crace)">
    <rect width="36" height="22" fill="#2d2d2d"/>
    <rect x="36" width="58" height="22" fill="#37d"/>
